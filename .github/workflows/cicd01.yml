name: Deploy To EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Repository 파일 불러오기
        uses: actions/checkout@v4

      - name: JDK 21버전 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: application.yml 파일 만들기
        run: echo "${{secrets.APPLICATION_PROPERTIES}}" > ./src/main/resources/application.yml

      - name: 빌드하기, jar파일 생성
        run: ./gradlew clean build

      - name: 빌드파일 이름 변경, 경로 변경
        run: mv ./build/libs/*SNAPSHOT.jar ./dgsw-sp.jar

      - name: SCP로 EC2에 빌드파일 전송
        uses: appleboy/scp-action@v1
        with:
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USERNAME}}
          key: ${{secrets.EC2_PRIVATE_KEY}}
          source: dgsw-sp.jar
          target: /home/ubuntu/dgsw-sp-server/jar

      - name: EC2에 접속하기
        uses: appleboy/scp-action@v1
        with:
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USERNAME}}
          key: ${{secrets.EC2_PRIVATE_KEY}}
          script_stop: true
          script: |
            rm -rf /home/ubuntu/dgsw-sp-server/current
            mkdir /home/ubuntu/dgsw-sp-server/current
            mv /home/ubuntu/dgsw-sp-server/jar/dgsw-sp.jar /home/ubuntu/dgsw-sp-server/current/dgsw-sp.jar
            cd /home/ubuntu/dgsw-sp-server/current
            sudo fuser -k -n tcp 80 || true
            sudo nohup java -jar dgsw-sp.jar > ./output.log